}

}

  margin-top: 6px;
}

.score-bar {

  width: 0%;

.section-body {

.opt.correct .opt-letter { background: var(--correct); color: #fff; }

  border: none;
  border-radius: 6px;

.q-fill-row {

.gen-btn {

.reset-btn {

  border-radius: 10px;
  background: var(--card);

  font-size: 0.95rem;
  font-weight: 600;
  color: var(--text);

.reset-btn:hover { border-color: var(--primary); background: var(--hover-bg); }

  .reading-passage { padding: 12px 14px; }

// ========== HELPERS ==========

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function pick(arr, n) {
  const shuffled = shuffle([...arr]);
  return shuffled.slice(0, n);
}

// ========== SCORE & RENDER ==========

let score = 0;
let totalQuestions = 0;
const answered = new Set();

function updateScore() {
  document.getElementById('scoreNum').textContent = score;
  const total = totalQuestions || 1;
  const pct = (score / total) * 100;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('totalText').textContent = '/ ' + totalQuestions;
}

function checkChoice(el, answer) {
  const question = el.closest('.question');
  const opts = question.querySelector('.opts');
  if (!opts) return;
  const correct = opts.dataset.answer;
  if (question.dataset.answered) return;
  question.dataset.answered = 'true';

  const allOpts = question.querySelectorAll('.opt');
  allOpts.forEach(o => o.classList.add('disabled'));

  if (answer === correct) {
    el.classList.add('correct');
    el.querySelector('.emoji-result').textContent = '✅';
    score++;
  } else {
    el.classList.add('wrong');
    el.querySelector('.emoji-result').textContent = '❌';
    allOpts.forEach(o => {
      if (o.dataset.letter === correct) {
        o.classList.add('show-correct');
      }
    });
  }
  updateScore();
}

function checkFill(qnum, answer) {
  const input = document.getElementById('fill' + qnum);
  if (!input || input.dataset.checked) return;
  const val = input.value.trim().toLowerCase();
  const ans = answer.toLowerCase();
  if (val === ans) {
    input.classList.add('correct');
    input.classList.remove('wrong');
    score++;
  } else {
    input.classList.add('wrong');
    input.classList.remove('correct');
  }
  input.dataset.checked = 'true';
  input.disabled = true;
  updateScore();
}

function resetAll() {
  score = 0;
  document.querySelectorAll('[data-answered]').forEach(q => delete q.dataset.answered);
  document.querySelectorAll('.opt').forEach(o => {
    o.classList.remove('correct', 'wrong', 'disabled', 'show-correct');
    o.querySelector('.emoji-result').textContent = '';
  });
  document.querySelectorAll('.fill-input').forEach(inp => {
    inp.classList.remove('correct', 'wrong');
    inp.value = '';
    inp.disabled = false;
    delete inp.dataset.checked;
  });
  updateScore();
}

// ========== GENERATE EXAM ==========

    html += '<button class="check-btn" onclick="checkFill(' + qNum + ',\'' + item.ans.replace(/'/g, "\\'") + '\')">✓ 检查</button>';

  html += '</div>';

  readingItem.questions.forEach((item, idx) => {

      html += '<div class="opt" data-letter="' + letters[oi] + '" onclick="checkChoice(this,\'' + letters[oi] + '\')">';
      html += '<span class="opt-letter">' + letters[oi].toUpperCase() + '</span>';
      html += opt;
      html += '<span class="emoji-result"></span></div>';
    });
    html += '</div></div>';
  });
  html += '</div>';
  totalQuestions += readingItem.questions.length;

  // --- Section IV: Error Correction (5 questions) ---
  const proofItems = pick(proofBank, 5);
  html += '<div class="section-header sec-proof"><span class="icon">D.</span> Error Correction 改错题</div>';
  html += '<div class="section-body sec-proof">';
  proofItems.forEach((item, idx) => {
    qNum++;
    const letters = ['a', 'b', 'c', 'd'];
    html += '<div class="question" id="q' + qNum + '">';

      html += '<div class="opt" data-letter="' + letters[oi] + '" onclick="checkChoice(this,\'' + letters[oi] + '\')">';
      html += '<span class="opt-letter">' + letters[oi].toUpperCase() + '</span>';
      html += opt;
      html += '<span class="emoji-result"></span></div>';
    });
    html += '</div></div>';
  });
  html += '</div>';
  totalQuestions += proofItems.length;

  content.innerHTML = html;
  resetAll();
  updateScore();
}
