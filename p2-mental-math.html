function randInt(a, b) {
  return Math.floor(Math.random() * (b - a + 1)) + a;
}

// ── 游戏状态 ──
let questions = [];
let currentIndex = 0;
let correctCount = 0;
let totalCount = 20;
let answered = false;

function generateOneQuestion(ops, range) {
  const op = ops[Math.floor(Math.random() * ops.length)];
  let a, b, ans, q;
  switch (op) {
    case 'add':
      a = randInt(0, range);
      b = randInt(0, range);
      ans = a + b;
      q = a + ' + ' + b + ' = ?';
      break;
    case 'sub':
      a = randInt(0, range);
      b = randInt(0, a);
      ans = a - b;
      q = a + ' − ' + b + ' = ?';
      break;
    case 'mul':
      {
        let minF = 2, maxF = 9;
        a = randInt(minF, maxF);
        b = randInt(minF, maxF);
        ans = a * b;
        q = a + ' × ' + b + ' = ?';
      }
      break;
    case 'div':
      {
        let quotient = randInt(1, Math.min(range, 12));
        let divisor = randInt(1, Math.min(range, 12));
        a = quotient * divisor;
        while (a > range * 2) {
          divisor = randInt(1, Math.min(range, 10));
          quotient = Math.max(1, Math.floor(range / divisor));
          a = quotient * divisor;
        }
        b = divisor;
        ans = quotient;
        q = a + ' ÷ ' + b + ' = ?';
      }
      break;
  }
  return { q, ans };
}

function startGame() {
  const range = parseInt(document.getElementById('rangeVal').value) || 20;
  totalCount = parseInt(document.getElementById('countVal').value) || 20;
  const ops = [];
  if (document.getElementById('opAdd').checked) ops.push('add');
  if (document.getElementById('opSub').checked) ops.push('sub');
  if (document.getElementById('opMul').checked) ops.push('mul');
  if (document.getElementById('opDiv').checked) ops.push('div');

  if (ops.length === 0) {
    alert('⚠️ 请至少选择一种运算！');
    return;
  }

  // 预设生成所有题目
  questions = [];
  for (let i = 0; i < totalCount; i++) {
    questions.push(generateOneQuestion(ops, range));
  }

  currentIndex = 0;
  correctCount = 0;
  answered = false;

  document.getElementById('settingsCard').style.display = 'none';
  document.getElementById('finishCard').style.display = 'none';
  document.getElementById('qaCard').style.display = 'block';

  showQuestion();
}

function showQuestion() {
  const q = questions[currentIndex];
  document.getElementById('questionText').textContent = q.q;
  document.getElementById('qaCardTitle').textContent = '第 ' + (currentIndex + 1) + ' / ' + totalCount + ' 题';

  const input = document.getElementById('answerInput');
  input.value = '';
  input.className = '';
  input.focus();
  answered = false;

  document.getElementById('submitBtn').style.display = 'none';
  document.getElementById('nextBtn').style.display = 'none';
  document.getElementById('feedback').textContent = '';
  document.getElementById('feedback').className = 'answer-feedback';
}

function recordAndAdvance() {
  if (answered) return;
  const input = document.getElementById('answerInput');
  const val = parseInt(input.value);
  if (isNaN(val)) return;
  answered = true;
  const q = questions[currentIndex];
  q.userAnswer = val;
  if (val === q.ans) correctCount++;
  currentIndex++;
  if (currentIndex >= totalCount) {
    showFinishScreen();
  } else {
    showQuestion();
  }
}

function pickPokemon(pct) {
  let pool;
  if (pct === 100) {
    // 满分：只从高分池抽
    pool = pokemonDB.filter(p => p.cp >= 550);
  } else if (pct >= 80) {
    pool = pokemonDB.filter(p => p.cp >= 350 && p.cp < 550);
  } else if (pct >= 60) {
    pool = pokemonDB.filter(p => p.cp >= 200 && p.cp < 350);
  } else {
    pool = pokemonDB.filter(p => p.cp < 200);
  }
  // 每个池至少保证有6只，如果不够就从相邻池补
  if (pool.length === 0) pool = pokemonDB;
  return pool[Math.floor(Math.random() * pool.length)];
}

function buildPokemonCard(pkm) {
  const typeClass = 'type-' + pkm.type;
  return '<div class="pkm-header">'
    + '<span>#' + String(pkm.cp).padStart(3,'0') + '</span>'
    + '<span class="pkm-hp">❤️ HP ' + pkm.hp + '</span>'
    + '</div>'
    + '<div class="pkm-sprite">' + pkm.emoji + '</div>'
    + '<div class="pkm-name">' + pkm.name + '</div>'
    + '<span class="pkm-type ' + typeClass + '">' + pkm.type.toUpperCase() + '</span>'
    + '<div class="pkm-cp-label">CP</div>'
    + '<div class="pkm-cp">' + pkm.cp + '</div>'
    + '<div class="pkm-stats">'
    + '<div class="pkm-stat"><span>⚔️ 攻击</span><span class="stat-val">' + pkm.atk + '</span></div>'
    + '<div class="pkm-stat"><span>🛡️ 防御</span><span class="stat-val">' + pkm.def + '</span></div>'
    + '<div class="pkm-stat"><span>💨 速度</span><span class="stat-val">' + pkm.spd + '</span></div>'
    + '<div class="pkm-stat"><span>📖 描述</span></div>'
    + '</div>'
    + '<div style="font-size:0.78rem;color:#5a3a00;padding:0 16px 14px;text-align:left;line-height:1.5">“' + pkm.desc + '”</div>';
}

function showFinishScreen() {
  document.getElementById('qaCard').style.display = 'none';
  const fc = document.getElementById('finishCard');
  fc.style.display = 'block';

  const pct = Math.round(correctCount / totalCount * 100);
  const scoreEl = document.getElementById('finishScore');
  scoreEl.textContent = correctCount + ' / ' + totalCount + ' 正确（' + pct + '%）';

  // 生成宝可梦卡牌
  const pkm = pickPokemon(pct);
  document.getElementById('pokemonCard').innerHTML = buildPokemonCard(pkm);

  // 生成每题结果列表
  const tbody = document.querySelector('#finishList tbody');
  tbody.innerHTML = '';
  let html = '';
  for (let i = 0; i < questions.length; i++) {
    const q = questions[i];
    const isCorrect = q.userAnswer === q.ans;
    const icon = isCorrect ? '✅' : '❌';
    const cls = isCorrect ? 'correct' : 'wrong';
    const ansDisplay = isCorrect ? q.ans : q.ans + ' （你答: ' + (q.userAnswer ?? '?') + '）';
    html += '<tr><td class="q-num">' + (i + 1) + '</td>'
         + '<td class="q-text">' + q.q.replace(' = ?', '') + '</td>'
         + '<td class="q-ans ' + cls + '">' + icon + ' ' + ansDisplay + '</td></tr>';
  }
  tbody.innerHTML = html;
}

function backToSettings() {
  document.getElementById('finishCard').style.display = 'none';
  document.getElementById('qaCard').style.display = 'none';
  document.getElementById('settingsCard').style.display = 'block';
}

// Enter 键提交/下一题
document.addEventListener('DOMContentLoaded', function() {
  document.getElementById('answerInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      recordAndAdvance();
    }
  });
});
