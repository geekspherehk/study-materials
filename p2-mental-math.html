<script>
function copyShareLink() {
  var url = window.location.href;
  if (navigator.clipboard) {
    navigator.clipboard.writeText(url).then(function() {
      var btn = document.querySelector('.share-copy');
      var orig = btn.textContent;
      btn.textContent = '✅ 已複製!';
      setTimeout(function() { btn.textContent = orig; }, 2000);
    });
  }
}

function randInt(a, b) {
  return Math.floor(Math.random() * (b - a + 1)) + a;
}

// ── 游戏状态 ──
let questions = [];
let currentIndex = 0;
let correctCount = 0;
let totalCount = 20;
let answered = false;

function generateOneQuestion(ops, range) {
  const op = ops[Math.floor(Math.random() * ops.length)];
  let a, b, ans, q;
  switch (op) {
    case 'add':
      a = randInt(0, range);
      b = randInt(0, range);
      ans = a + b;
      q = a + ' + ' + b + ' = ?';
      break;
    case 'sub':
      a = randInt(0, range);
      b = randInt(0, a);
      ans = a - b;
      q = a + ' − ' + b + ' = ?';
      break;
    case 'mul':
      {
        let minF = 2, maxF = 9;
        a = randInt(minF, maxF);
        b = randInt(minF, maxF);
        ans = a * b;
        q = a + ' × ' + b + ' = ?';
      }
      break;
    case 'div':
      {
        let quotient = randInt(1, Math.min(range, 12));
        let divisor = randInt(1, Math.min(range, 12));
        a = quotient * divisor;
        while (a > range * 2) {
          divisor = randInt(1, Math.min(range, 10));
          quotient = Math.max(1, Math.floor(range / divisor));
          a = quotient * divisor;
        }
        b = divisor;
        ans = quotient;
        q = a + ' ÷ ' + b + ' = ?';
      }
      break;
  }
  return { q, ans };
}

function startGame() {
  const range = parseInt(document.getElementById('rangeVal').value) || 20;
  const ops = [];
  if (document.getElementById('opAdd').checked) ops.push('add');
  if (document.getElementById('opSub').checked) ops.push('sub');
  if (document.getElementById('opMul').checked) ops.push('mul');
  if (document.getElementById('opDiv').checked) ops.push('div');

  if (ops.length === 0) {
    alert('⚠️ 请至少选择一种运算！');
    return;
  }

  // 预设生成所有题目
  questions = [];
  for (let i = 0; i < totalCount; i++) {
    questions.push(generateOneQuestion(ops, range));
  }

  currentIndex = 0;
  correctCount = 0;
  answered = false;

  document.getElementById('settingsCard').style.display = 'none';
  document.getElementById('finishCard').style.display = 'none';
  document.getElementById('qaCard').style.display = 'block';

  showQuestion();
}

function showQuestion() {
  const q = questions[currentIndex];
  document.getElementById('questionText').textContent = q.q;
  document.getElementById('qaCardTitle').textContent = '第 ' + (currentIndex + 1) + ' / ' + totalCount + ' 题';

  const input = document.getElementById('answerInput');
  input.value = '';
  input.className = '';
  input.focus();
  answered = false;

  document.getElementById('submitBtn').style.display = 'none';
  document.getElementById('nextBtn').style.display = 'none';
  document.getElementById('feedback').textContent = '';
  document.getElementById('feedback').className = 'answer-feedback';
}

function recordAndAdvance() {
  if (answered) return;
  const input = document.getElementById('answerInput');
  const val = parseInt(input.value);
  if (isNaN(val)) return;
  answered = true;
  const q = questions[currentIndex];
  q.userAnswer = val;
  if (val === q.ans) correctCount++;
  currentIndex++;
  if (currentIndex >= totalCount) {
    showFinishScreen();
  } else {
    showQuestion();
  }
}

function showFinishScreen() {
  document.getElementById('qaCard').style.display = 'none';
  const fc = document.getElementById('finishCard');
  fc.style.display = 'block';

  const pct = Math.round(correctCount / totalCount * 100);
  const scoreEl = document.getElementById('finishScore');
  scoreEl.textContent = correctCount + ' / ' + totalCount + ' 正确（' + pct + '%）';

  const emoji = document.getElementById('finishEmoji');
  const msgEl = document.getElementById('finishMsg');

  if (pct === 100) {
    emoji.textContent = '🎉🌟🎉';
    msgEl.textContent = '满分！你是口算小天才！';
  } else if (pct >= 80) {
    emoji.textContent = '👍🌟';
    msgEl.textContent = '做得很好！继续加油！';
  } else if (pct >= 60) {
    emoji.textContent = '💪📖';
    msgEl.textContent = '继续努力，多练就会越来越好！';
  } else {
    emoji.textContent = '😊📚';
    msgEl.textContent = '没关系，口算就是要多练！';
  }

  if (pct === 100) scoreEl.style.color = '#27ae60';
  else if (pct >= 80) scoreEl.style.color = '#2563eb';
  else if (pct >= 60) scoreEl.style.color = '#e67e22';
  else scoreEl.style.color = '#e74c3c';
}

function backToSettings() {
  document.getElementById('finishCard').style.display = 'none';
  document.getElementById('qaCard').style.display = 'none';
  document.getElementById('settingsCard').style.display = 'block';
}

// Enter 键提交/下一题
document.addEventListener('DOMContentLoaded', function() {
  document.getElementById('answerInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      recordAndAdvance();
    }
  });
});
</script>
