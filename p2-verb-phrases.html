<script>
const VOCAB = [
  { en: 'get up', zh: '起床' },
  { en: 'brush my teeth', zh: '刷牙' },
  { en: 'wash my face', zh: '洗脸' },
  { en: 'have breakfast', zh: '吃早餐' },
  { en: 'go to school', zh: '去上学' },
  { en: 'have lunch', zh: '吃午餐' },
  { en: 'do my homework', zh: '做家庭作业' },
  { en: 'have dinner', zh: '吃晚餐' },

  { en: 'have a shower', zh: '淋浴' },
  { en: 'go to bed', zh: '上床睡觉' },
];

let shuffled = false;

function renderGrid() {
  const grid = document.getElementById('vocabGrid');
  grid.innerHTML = '';
  let words = [...VOCAB];
  if (shuffled) {
    for (let i = words.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [words[i], words[j]] = [words[j], words[i]];
    }
  }
  words.forEach((w, idx) => {
    const div = document.createElement('div');
    div.className = 'vocab-item';
    div.innerHTML = '<span class="vocab-num">' + (idx+1) + '</span><div class="en">' + w.en + ' <small>↻</small></div><div class="zh">' + w.zh + '</div>';
    div.onclick = function() { this.classList.toggle('show-zh'); };
    grid.appendChild(div);
  });
}

function shuffleVocab() { shuffled = true; renderGrid(); }
function toggleAll() {
  const items = document.querySelectorAll('.vocab-item');
  const anyHidden = Array.from(items).some(item => !item.classList.contains('show-zh'));
  items.forEach(item => item.classList.toggle('show-zh', anyHidden));
}

renderGrid();
</script>
