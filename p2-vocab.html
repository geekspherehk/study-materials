    { en: 'which', zh: '哪一个', exEn: 'Which one do you like?', exZh: '你喜欢哪一个？' },
  ]},
  19: { title: 'U19 - Imperatives', words: [
    { en: 'sit', zh: '坐', exEn: 'Sit down, please.', exZh: '请坐下。' },
    { en: 'stand', zh: '站', exEn: 'Stand up, please.', exZh: '请起立。' },
    { en: 'open', zh: '打开', exEn: 'Open the door.', exZh: '打开门。' },
    { en: 'close', zh: '关闭', exEn: 'Close the window.', exZh: '关上窗户。' },
    { en: 'come', zh: '来', exEn: 'Come here.', exZh: '过来这里。' },
    { en: 'go', zh: '去', exEn: 'Go to bed.', exZh: '去睡觉。' },
    { en: 'look', zh: '看', exEn: 'Look at the board.', exZh: '看黑板。' },
  ]},
  20: { title: 'U20 - Comprehension (Letters)', words: [
    { en: 'letter', zh: '信；字母', exEn: 'Write a letter.', exZh: '写一封信。' },
    { en: 'friend', zh: '朋友', exEn: 'My friend is Tom.', exZh: '我的朋友是汤姆。' },
    { en: 'address', zh: '地址', exEn: 'What is your address?', exZh: '你的地址是哪里？' },
    { en: 'envelope', zh: '信封', exEn: 'Put it in an envelope.', exZh: '把它放进信封里。' },
    { en: 'stamp', zh: '邮票', exEn: 'Put a stamp on it.', exZh: '贴上邮票。' },
    { en: 'post', zh: '邮寄；邮件', exEn: 'I post a letter.', exZh: '我寄一封信。' },
    { en: 'story', zh: '故事', exEn: 'Tell me a story.', exZh: '给我讲个故事。' },
  ]},
};

// State
let currentUnit = 1;
let vocabList = [];
let currentIndex = 0;

function init() {
  // Build unit tabs
  const tabContainer = document.getElementById('unitTabs');
  for (let i = 1; i <= 20; i++) {
    const tab = document.createElement('button');
    tab.className = 'unit-tab' + (i === 1 ? ' active' : '');
    tab.textContent = 'U' + i;
    tab.dataset.unit = i;
    tab.addEventListener('click', function() {
      document.querySelectorAll('.unit-tab').forEach(t => t.classList.remove('active'));
      this.classList.add('active');
      currentUnit = parseInt(this.dataset.unit);
      document.getElementById('unitTitle').textContent = ALL_VOCAB[currentUnit].title;
      vocabList = [...ALL_VOCAB[currentUnit].words];
      shuffleArray(vocabList);
      currentIndex = 0;
      showCard();
    });
    tabContainer.appendChild(tab);
  }

  // Load first unit
  vocabList = [...ALL_VOCAB[1].words];
  shuffleArray(vocabList);
  showCard();
}

function shuffleArray(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
}

function shuffleVocab() {
  shuffleArray(vocabList);
  currentIndex = 0;
  showCard();
}

function showCard() {
  const flashcard = document.getElementById('flashcard');
  flashcard.classList.remove('flipped');

  if (vocabList.length === 0) return;

  const word = vocabList[currentIndex];
  document.getElementById('frontWord').textContent = word.en;
  document.getElementById('frontExample').textContent = word.exEn;
  document.getElementById('backWord').textContent = word.zh;
  document.getElementById('backExample').textContent = word.exZh;
  document.getElementById('flipCount').textContent = '第 ' + (currentIndex + 1) + ' / ' + vocabList.length + ' 个词';
}

function flipCard() {
  const flashcard = document.getElementById('flashcard');
  if (flashcard.classList.contains('flipped')) {
    // Go to next card
    currentIndex = (currentIndex + 1) % vocabList.length;
    showCard();
  } else {
    flashcard.classList.add('flipped');
  }
}

init();
</script>
