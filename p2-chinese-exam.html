  {title:'小馬過河',passage:'小馬要過河，它看見一頭牛在河邊吃草。小馬問：「牛伯伯，河裏的水深嗎？」老牛說：「水很淺，才到我的小腿。」一隻松鼠跑過來說：「水很深，會淹死你的！」小馬不知道該聽誰的。它回家問媽媽。媽媽說：「孩子，你要自己試一試才知道。」小馬小心地走進河裏，發現河水不深也不淺。',
   questions:[

  {q:'我今天〈心〉情很好。',opts:['心情','心情','心晴','Do not change'],ans:'a'},
  {q:'小〈明〉是我的好朋友。',opts:['名','明','民','Do not change'],ans:'b'},

/* ======================================================
   HELPERS
   ====================================================== */
function pick(arr, n) {
  const shuffled = [...arr];
  for (let i = shuffled.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
  }
  return shuffled.slice(0, n);
}

/* ======================================================
   STATE
   ====================================================== */
let score = 0;
let total = 0;
const answered = new Set();

function updateScore() {
  document.getElementById('scoreDisplay').textContent = score;
  document.getElementById('totalDisplay').textContent = total;
}

/* ======================================================
   GENERATE EXAM
   ====================================================== */
function generateExam() {
  score = 0;
  total = 0;
  answered.clear();
  updateScore();

  const mcqList = pick(mcqBank, 6);
  const fillList = pick(fillBank, 4);
  const readingItem = pick(readingBank, 1)[0];
  const proofList = pick(proofBank, 4);

  total = mcqList.length + fillList.length + readingItem.questions.length + proofList.length;
  document.getElementById('totalDisplay').textContent = total;
  document.getElementById('qCountDisplay').textContent = total;

  let qNum = 0;
  let html = '';

  /* === Section 1: 选择题 === */
  html += '<div class="section"><div class="section-title">一、選擇題（選出正確答案）</div><div class="section-body">';
  mcqList.forEach((item, idx) => {
    qNum++;
    const qid = 'mcq' + idx;
    const letters = ['a','b','c','d'];
    html += `<div class="question" id="q${qid}">
      <div class="q-text"><span class="q-num">${qNum}.</span> ${item.q}</div>
      <div class="opts" data-answer="${item.ans}" data-qid="${qid}">`;
    item.opts.forEach((opt, oi) => {
      const letter = letters[oi];
      html += `<div class="opt" data-letter="${letter.toUpperCase()}" onclick="checkOpt(this,'${qid}')">
        <span class="opt-letter">${letter.toUpperCase()}</span>${opt}<span class="emoji-result"></span>
      </div>`;
    });
    html += '</div></div>';
  });
  html += '</div></div>';

  /* === Section 2: 填空题 === */
  html += '<div class="section"><div class="section-title">二、填空題（填上正確答案）</div><div class="section-body">';
  fillList.forEach((item, idx) => {
    qNum++;
    const qid = 'fill' + idx;
    html += `<div class="question" id="q${qid}">
      <div class="q-text"><span class="q-num">${qNum}.</span> ${item.q.replace('____','<span class="blank">_____</span>')}</div>
      <div class="q-fill-row">
        <input class="fill-input" id="${qid}" type="text" placeholder="輸入答案" style="width:${item.w||80}px" onkeydown="if(event.key==='Enter')checkFill('${qid}','${item.ans}')">
        <button class="check-btn" onclick="checkFill('${qid}','${item.ans}')">✓ 檢查</button>
      </div>
    </div>`;
  });
  html += '</div></div>';

  /* === Section 3: 阅读理解 === */
  html += `<div class="section"><div class="section-title">三、閱讀理解（閱讀短文，回答問題）</div><div class="section-body">`;
  html += `<div class="reading-passage"><div class="rp-title">📄 ${readingItem.title}</div><div class="rp-content">${readingItem.passage}</div></div>`;
  readingItem.questions.forEach((q, qi) => {
    qNum++;
    const qid = 'read' + qi;
    const letters = ['a','b','c','d'];
    html += `<div class="question" id="q${qid}">
      <div class="q-text"><span class="q-num">${qNum}.</span> ${q.q}</div>
      <div class="opts" data-answer="${q.ans}" data-qid="${qid}">`;
    q.opts.forEach((opt, oi) => {
      const letter = letters[oi];
      html += `<div class="opt" data-letter="${letter.toUpperCase()}" onclick="checkOpt(this,'${qid}')">
        <span class="opt-letter">${letter.toUpperCase()}</span>${opt}<span class="emoji-result"></span>
      </div>`;
    });
    html += '</div></div>';
  });
  html += '</div></div>';

  /* === Section 4: 改错题 === */
  html += '<div class="section"><div class="section-title">四、改錯題（選出括號內的正確字）</div><div class="section-body">';
  proofList.forEach((item, idx) => {
    qNum++;
    const qid = 'proof' + idx;
    const letters = ['a','b','c','d'];
    html += `<div class="question" id="q${qid}">
      <div class="q-text"><span class="q-num">${qNum}.</span> ${item.q}</div>
      <div class="opts" data-answer="${item.ans}" data-qid="${qid}">`;
    item.opts.forEach((opt, oi) => {
      const letter = letters[oi];
      let label = opt;
      if (opt === 'Do not change') label = '✓ 無需改動';
      html += `<div class="opt" data-letter="${letter.toUpperCase()}" onclick="checkOpt(this,'${qid}')">
        <span class="opt-letter">${letter.toUpperCase()}</span>${label}<span class="emoji-result"></span>
      </div>`;
    });
    html += '</div></div>';
  });
  html += '</div></div>';

  document.getElementById('examArea').innerHTML = html;
}

/* ======================================================
   CHECK ANSWER
   ====================================================== */
function checkOpt(el, qid) {
  if (answered.has(qid)) return;
  const optsDiv = el.closest('.opts');
  const correctAns = optsDiv.dataset.answer;
  const chosen = el.dataset.letter.toLowerCase();

  // Mark all opts disabled
  optsDiv.querySelectorAll('.opt').forEach(o => o.classList.add('disabled'));
  el.classList.add('selected');

  if (chosen === correctAns) {
    el.classList.add('correct');
    el.querySelector('.emoji-result').textContent = '✅';
    score++;
  } else {
    el.classList.add('wrong');
    el.querySelector('.emoji-result').textContent = '❌';
    // Show correct answer
    optsDiv.querySelectorAll('.opt').forEach(o => {
      if (o.dataset.letter.toLowerCase() === correctAns) {
        o.classList.add('correct');
        o.querySelector('.emoji-result').textContent = '✅';
      }
    });
  }
  answered.add(qid);
  updateScore();
}

function checkFill(qid, ans) {
  if (answered.has(qid)) return;
  const input = document.getElementById(qid);
  const val = input.value.trim();
  if (!val) return;
  answered.add(qid);
  const btn = input.nextElementSibling;
  btn.disabled = true;
  if (val === ans) {
    input.classList.add('correct');
    score++;
    input.value = '✓ ' + ans;
  } else {
    input.classList.add('wrong');
    input.value = '✗ ' + val + '（正確：' + ans + '）';
  }
  updateScore();
}

function resetChecks() {
  document.querySelectorAll('.opt').forEach(o => {
    o.classList.remove('correct','wrong','selected','disabled');
    o.querySelector('.emoji-result').textContent = '';
  });
  document.querySelectorAll('.fill-input').forEach(inp => {
    inp.classList.remove('correct','wrong');
    const btn = inp.nextElementSibling;
    btn.disabled = false;
  });
  score = 0;
  answered.clear();
  updateScore();
}

/* Generate on load */
document.addEventListener('DOMContentLoaded', generateExam);
</script>
