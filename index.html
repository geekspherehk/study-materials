<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学习素材站</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, sans-serif; background: #f5f5f5; color: #333; }
  header { background: #2c3e50; color: #fff; padding: 20px; text-align: center; }
  header h1 { font-size: 1.5rem; font-weight: 600; }
  nav { display: flex; justify-content: center; gap: 4px; background: #34495e; padding: 8px; flex-wrap: wrap; }
  nav button { background: transparent; border: 1px solid #555; color: #ccc; padding: 6px 14px; border-radius: 4px; cursor: pointer; font-size: 0.9rem; }
  nav button:hover, nav button.active { background: #2c3e50; border-color: #2c3e50; color: #fff; }

  /* 背单词 */
  .word-grid { display: flex; flex-direction: column; gap: 8px; max-height: 520px; overflow-y: auto; padding-right: 4px; }
  .word-item { display: grid; grid-template-columns: 40px 1fr auto; gap: 10px; align-items: center; background: #f8f9fa; border-radius: 8px; padding: 10px 12px; }
  .word-item .num { font-weight: 700; color: #888; font-size: 0.85rem; }
  .word-item .en { font-weight: 600; font-size: 1.05rem; color: #2c3e50; }
  .word-item input { border: 1px solid #ccc; border-radius: 4px; padding: 5px 8px; font-size: 0.95rem; width: 120px; }
  .word-item.correct input { border-color: #27ae60; background: #eafaf1; }
  .word-item.wrong input { border-color: #e74c3c; background: #fdecea; }
  .word-item.correct .en, .word-item.correct .num { color: #27ae60; }
  .word-item.wrong .en, .word-item.wrong .num { color: #e74c3c; }
  .word-item .hint { font-size: 0.8rem; color: #888; min-width: 60px; }
  .word-item.show-answer .hint { color: #27ae60; font-weight: 600; }
  main { max-width: 700px; margin: 24px auto; padding: 0 16px; }
  .section { display: none; }
  .section.active { display: block; }
  .card { background: #fff; border-radius: 10px; padding: 20px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
  h2 { font-size: 1.1rem; margin-bottom: 14px; color: #2c3e50; border-bottom: 2px solid #eee; padding-bottom: 8px; }

  /* 口算题 */
  .qa-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .qa-item { background: #f8f9fa; border-radius: 8px; padding: 12px; text-align: center; }
  .qa-item span { font-size: 1.1rem; font-weight: 600; color: #2c3e50; }
  .qa-item input { width: 60px; text-align: center; border: 1px solid #ccc; border-radius: 4px; padding: 4px; margin-left: 6px; font-size: 1rem; }
  .qa-item.correct input { border-color: #27ae60; background: #eafaf1; }
  .qa-item.wrong input { border-color: #e74c3c; background: #fdecea; }
  .qa-item.correct span { color: #27ae60; }
  .qa-item.wrong span { color: #e74c3c; }
  .btn { background: #2c3e50; color: #fff; border: none; padding: 10px 24px; border-radius: 6px; cursor: pointer; font-size: 0.95rem; }
  .btn:hover { background: #34495e; }
  .btn+input { vertical-align: middle; margin-right: 8px; }

  /* 闪卡 */
  .flashcard-wrap { perspective: 1000px; max-width: 400px; margin: 0 auto 16px; }
  .flashcard { width: 100%; height: 180px; position: relative; transform-style: preserve-3d; transition: transform 0.5s; cursor: pointer; }
  .flashcard.flipped { transform: rotateY(180deg); }
  .flashcard-face { position: absolute; inset: 0; backface-visibility: hidden; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; font-weight: 600; padding: 20px; text-align: center; }
  .flashcard-front { background: linear-gradient(135deg, #2c3e50, #34495e); color: #fff; }
  .flashcard-back { background: linear-gradient(135deg, #27ae60, #2ecc71); color: #fff; transform: rotateY(180deg); }
  .flash-nav { display: flex; justify-content: center; gap: 12px; align-items: center; }
  .flash-nav span { color: #888; font-size: 0.9rem; }
  .flash-nav button { background: #eee; border: none; padding: 6px 16px; border-radius: 4px; cursor: pointer; }
  .flash-nav button:hover { background: #ddd; }

  /* IELTS */
  .ielts-list { list-style: none; }
  .ielts-list li { padding: 10px 0; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
  .ielts-list li:last-child { border-bottom: none; }
  .ielts-list a { color: #2980b9; text-decoration: none; }
  .ielts-list a:hover { text-decoration: underline; }
  .tag { background: #e8f4fd; color: #2980b9; font-size: 0.75rem; padding: 2px 8px; border-radius: 12px; }

  #result-bar { text-align: center; margin-top: 10px; font-weight: 600; color: #2c3e50; }
  .score-good { color: #27ae60; }
  .score-bad { color: #e74c3c; }

  /* 全对弹窗 */
  #reward-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 999; justify-content: center; align-items: center; flex-direction: column; gap: 24px; }
  #reward-overlay.show { display: flex; }
  .reward-burst { position: relative; width: 300px; height: 300px; display: flex; justify-content: center; align-items: center; }
  .reward-burst::before {
    content: ''; position: absolute; inset: -40px;
    background: radial-gradient(circle, rgba(255,215,0,0.9) 0%, rgba(255,165,0,0.5) 35%, transparent 70%);
    border-radius: 50%; animation: burstPulse 1.2s ease-in-out infinite;
  }
  .reward-burst::after {
    content: ''; position: absolute; inset: -80px;
    background: radial-gradient(circle, rgba(255,255,255,0.3) 0%, transparent 60%);
    border-radius: 50%; animation: burstSpin 3s linear infinite;
  }
  @keyframes burstPulse {
    0%, 100% { transform: scale(1); opacity: 0.9; }
    50% { transform: scale(1.15); opacity: 1; }
  }
  @keyframes burstSpin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  .reward-img { position: relative; z-index: 1; width: 260px; height: 260px; object-fit: contain; animation: rewardPop 0.6s cubic-bezier(0.34,1.56,0.64,1) forwards, rewardFloat 2s ease-in-out 0.6s infinite alternate; }
  @keyframes rewardPop {
    0% { transform: scale(0) rotate(-20deg); opacity: 0; }
    100% { transform: scale(1) rotate(0deg); opacity: 1; }
  }
  @keyframes rewardFloat {
    from { transform: translateY(0); }
    to { transform: translateY(-12px); }
  }
  .reward-text { position: relative; z-index: 1; color: #ffd700; font-size: 1.8rem; font-weight: 800; text-align: center; text-shadow: 0 0 20px rgba(255,215,0,0.8), 0 2px 4px rgba(0,0,0,0.5); animation: textGlow 1.5s ease-in-out infinite alternate; }
  @keyframes textGlow {
    from { text-shadow: 0 0 20px rgba(255,215,0,0.8), 0 2px 4px rgba(0,0,0,0.5); }
    to { text-shadow: 0 0 40px rgba(255,215,0,1), 0 0 60px rgba(255,165,0,0.6), 0 2px 4px rgba(0,0,0,0.5); }
  }
  .reward-btn { position: relative; z-index: 1; background: transparent; border: 2px solid #ffd700; color: #ffd700; padding: 8px 28px; border-radius: 30px; cursor: pointer; font-size: 1rem; font-weight: 600; transition: all 0.2s; }
  .reward-btn:hover { background: #ffd700; color: #000; }
</style>
</head>
<body>

<header>
  <h1>📚 学习素材站</h1>
</header>

<nav>
  <button class="active" onclick="show('math')">口算练习</button>
  <button onclick="show('flash')">闪卡背词</button>
  <button onclick="show('vocab')">背单词</button>
  <button onclick="show('ielts')">IELTS 资料</button>
</nav>

<main>

  <!-- 口算练习 -->
  <div id="math" class="section active">
    <div class="card">
      <h2>1~5 的乘法口算</h2>
      <div class="qa-grid" id="qaGrid"></div>
      <div style="margin-top:16px; text-align:center;">
        <button class="btn" onclick="genQuestions()">重新生成</button>
        <button class="btn" onclick="checkAnswers()" style="background:#27ae60;">批改</button>
        <span id="result-bar"></span>
      </div>
    </div>
  </div>

  <!-- 全对奖励弹窗 -->
  <div id="reward-overlay">
    <div class="reward-burst">
      <img class="reward-img" id="rewardImg" src="" alt="神兽登场">
    </div>
    <div class="reward-text" id="rewardText">全对！神兽登场！</div>
    <button class="reward-btn" onclick="closeReward()">太棒了！</button>
  </div>

  <!-- 闪卡 -->
  <div id="flash" class="section">
    <div class="card">
      <h2>点击卡片翻转 · 学习 IELTS 核心词汇</h2>
      <div class="flashcard-wrap">
        <div class="flashcard" id="flashcard" onclick="flipCard()">
          <div class="flashcard-face flashcard-front" id="fcFront">点击开始</div>
          <div class="flashcard-face flashcard-back" id="fcBack"></div>
        </div>
      </div>
      <div class="flash-nav">
        <button onclick="prevCard()">← 上一张</button>
        <span id="fcCount">1 / 20</span>
        <button onclick="nextCard()">下一张 →</button>
      </div>
    </div>
  </div>

  <!-- 背单词 -->
  <div id="vocab" class="section">
    <div class="card">
      <h2>小学二年级英文 · 看英文写中文（50题）</h2>
      <div class="word-grid" id="wordGrid"></div>
      <div style="margin-top:16px; text-align:center;">
        <button class="btn" onclick="genVocab()">换一批</button>
        <button class="btn" onclick="checkVocab()" style="background:#27ae60;">批改</button>
        <span id="vocabResult"></span>
      </div>
    </div>
  </div>

  <!-- IELTS 资料 -->
  <div id="ielts" class="section">
    <div class="card">
      <h2>IELTS 核心资料</h2>
      <ul class="ielts-list">
        <li>
          <a href="https://hcnyxzcp6mqq.feishu.cn/docx/Ah9NdkKlsoA79yx9bWbcde9RnEg" target="_blank">🎯 IELTS 6.5 分冲刺计划</a>
          <span class="tag">计划</span>
        </li>
        <li>
          <a href="https://hcnyxzcp6mqq.feishu.cn/drive/folder/VLzPfW9UDl5H1cdzNXDcnZYenNF" target="_blank">📁 IELTS 共享资料文件夹</a>
          <span class="tag">文件夹</span>
        </li>
        <li>
          <a href="#" onclick="alert('请在飞书共享文件夹中查看 ielts_flashcards.html')">📇 闪卡 HTML 文件</a>
          <span class="tag">下载</span>
        </li>
      </ul>
    </div>
  </div>

</main>

<script>
// ── 口算 ──────────────────────────────────────────
const questions = [];
let answers = [];

function randInt(a, b) { return Math.floor(Math.random() * (b - a + 1)) + a; }

function genQuestions() {
  const qaGrid = document.getElementById('qaGrid');
  qaGrid.innerHTML = '';
  questions.length = 0;
  answers = [];
  document.getElementById('result-bar').textContent = '';
  document.getElementById('result-bar').className = '';

  for (let i = 0; i < 20; i++) {
    const a = randInt(1, 5);
    const b = randInt(1, 9);
    questions.push({ a, b, product: a * b });
    answers.push(null);

    const item = document.createElement('div');
    item.className = 'qa-item';
    item.id = 'q' + i;
    item.innerHTML = `<span>${a} × ${b} = </span><input type="number" id="i${i}" oninput="answers[${i}]=this.value">`;
    qaGrid.appendChild(item);
  }
}

const REWARD_POKEMON = [
  { name: '烈空坐', img: 'https://img.pokemondb.net/artwork/large/rayquaza.jpg' },
  { name: '洛奇亚', img: 'https://img.pokemondb.net/artwork/large/lugia.jpg' },
  { name: '凤王', img: 'https://img.pokemondb.net/artwork/large/ho-oh.jpg' },
  { name: '超梦', img: 'https://img.pokemondb.net/artwork/large/mewtwo.jpg' },
  { name: '基格尔德', img: 'https://img.pokemondb.net/artwork/large/zacian-crowned.jpg' },
  { name: '奈克洛兹玛', img: 'https://img.pokemondb.net/artwork/large/necrozma.jpg' },
  { name: '捷克罗姆', img: 'https://img.pokemondb.net/artwork/large/zekrom.jpg' },
  { name: '莱希拉姆', img: 'https://img.pokemondb.net/artwork/large/reshiram.jpg' },
];

function showReward() {
  const p = REWARD_POKEMON[Math.floor(Math.random() * REWARD_POKEMON.length)];
  document.getElementById('rewardImg').src = p.img;
  document.getElementById('rewardText').textContent = p.name + ' 登场！';
  document.getElementById('reward-overlay').classList.add('show');
}
function closeReward() {
  document.getElementById('reward-overlay').classList.remove('show');
}

function checkAnswers() {
  let correct = 0;
  questions.forEach((q, i) => {
    const item = document.getElementById('q' + i);
    const input = document.getElementById('i' + i);
    const userAns = parseInt(input.value);
    item.classList.remove('correct', 'wrong');
    if (!isNaN(userAns)) {
      if (userAns === q.product) {
        item.classList.add('correct');
        correct++;
      } else {
        item.classList.add('wrong');
      }
    } else {
      item.classList.add('wrong');
    }
  });
  const total = questions.length;
  const pct = Math.round(correct / total * 100);
  const bar = document.getElementById('result-bar');
  bar.textContent = `${correct} / ${total} 正确（${pct}%）`;
  bar.className = pct >= 90 ? 'score-good' : 'score-bad';
  if (correct === total) showReward();
}

// ── 闪卡 ──────────────────────────────────────────
const flashCards = [
  { front: 'vocabulary', back: 'n. 词汇；词汇量' },
  { front: 'fluent', back: 'adj. 流利的；流畅的' },
  { front: 'comprehensive', back: 'adj. 综合的；全面的' },
  { front: 'persuade', back: 'v. 说服；使相信' },
  { front: 'illustrate', back: 'v. 说明；阐明；给…加插图' },
  { front: 'accumulate', back: 'v. 积累；积聚' },
  { front: 'circumstance', back: 'n. 情况；环境；形势' },
  { front: 'significant', back: 'adj. 重要的；意义重大的' },
  { front: 'acknowledge', back: 'v. 承认；确认；表示感谢' },
  { front: 'alternative', back: 'n. / adj. 替代；替代的；可供选择' },
  { front: 'benefit', back: 'n. 利益；好处；v. 有益于' },
  { front: 'participate', back: 'v. 参加；参与' },
  { front: 'environment', back: 'n. 环境；周围状况' },
  { front: 'economy', back: 'n. 经济；节约' },
  { front: 'guarantee', back: 'v. / n. 保证；担保' },
  { front: 'investigate', back: 'v. 调查；研究' },
  { front: 'maintain', back: 'v. 维持；保持；坚持；维护' },
  { front: 'requirement', back: 'n. 要求；必要条件；需求' },
  { front: 'sufficient', back: 'adj. 足够的；充足的' },
  { front: 'tendency', back: 'n. 倾向；趋势' },
];

let fcIdx = 0;

function renderCard() {
  const c = flashCards[fcIdx];
  document.getElementById('fcFront').textContent = c.front;
  document.getElementById('fcBack').textContent = c.back;
  document.getElementById('fcCount').textContent = `${fcIdx + 1} / ${flashCards.length}`;
  document.getElementById('flashcard').classList.remove('flipped');
}

function flipCard() {
  document.getElementById('flashcard').classList.toggle('flipped');
}
function prevCard() {
  fcIdx = (fcIdx - 1 + flashCards.length) % flashCards.length;
  renderCard();
}
function nextCard() {
  fcIdx = (fcIdx + 1) % flashCards.length;
  renderCard();
}

// ── 背单词 ───────────────────────────────────────
const WORD_BANK = [
  ["apple","苹果"],["banana","香蕉"],["orange","橙子"],["cat","猫"],["dog","狗"],
  ["bird","鸟"],["fish","鱼"],["book","书"],["pen","笔"],["pencil","铅笔"],
  ["bag","书包"],["chair","椅子"],["desk","书桌"],["bed","床"],["door","门"],
  ["window","窗户"],["box","盒子"],["ball","球"],["cake","蛋糕"],["bread","面包"],
  ["milk","牛奶"],["water","水"],["egg","鸡蛋"],["rice","米饭"],["hand","手"],
  ["foot","脚"],["eye","眼睛"],["ear","耳朵"],["mouth","嘴巴"],["nose","鼻子"],
  ["head","头"],["arm","手臂"],["leg","腿"],["body","身体"],["red","红色"],
  ["blue","蓝色"],["green","绿色"],["yellow","黄色"],["white","白色"],["black","黑色"],
  ["one","一"],["two","二"],["three","三"],["four","四"],["five","五"],
  ["six","六"],["seven","七"],["eight","八"],["nine","九"],["ten","十"],
  ["morning","早上"],["noon","中午"],["night","晚上"],["today","今天"],["moon","月亮"],
  ["sun","太阳"],["star","星星"],["tree","树"],["flower","花"],["grass","草"],
  ["river","河"],["house","房子"],["school","学校"],["teacher","老师"],["student","学生"],
  ["friend","朋友"],["brother","兄弟"],["sister","姐妹"],["mother","妈妈"],["father","爸爸"],
  ["boy","男孩"],["girl","女孩"],["baby","宝宝"],["rain","雨"],["snow","雪"],
  ["wind","风"],["cloud","云"],["hot","热的"],["cold","冷的"],["big","大的"],
  ["small","小的"],["long","长的"],["short","短的"],["tall","高的"],["new","新的"],
  ["old","旧的"],["good","好的"],["bad","坏的"],["happy","开心的"],["sad","伤心的"],
  ["hungry","饿的"],["thirsty","渴的"],["run","跑"],["walk","走"],["jump","跳"],
  ["sit","坐"],["stand","站"],["open","打开"],["close","关闭"],["eat","吃"],
  ["drink","喝"],["sleep","睡觉"],["read","读"],["write","写"],["draw","画"],
  ["sing","唱歌"],["dance","跳舞"],["play","玩"],["work","工作"],["love","爱"],
  ["this","这个"],["that","那个"],["here","这里"],["there","那里"],["yes","是"],["no","不"],
  ["please","请"],["thank","谢谢"],["sorry","对不起"],["hello","你好"],["bye","再见"],
];

let vocabQuiz = [];

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function genVocab() {
  const pool = shuffle(WORD_BANK).slice(0, 50);
  vocabQuiz = pool;
  const grid = document.getElementById('wordGrid');
  grid.innerHTML = '';
  document.getElementById('vocabResult').textContent = '';
  pool.forEach(([en, cn], i) => {
    const item = document.createElement('div');
    item.className = 'word-item';
    item.id = 'vw' + i;
    item.innerHTML = `
      <span class="num">${i + 1}.</span>
      <span class="en">${en}</span>
      <input type="text" id="vi${i}" placeholder="中文" oninput="document.getElementById('vw${i}').classList.remove('correct','wrong')">
      <span class="hint" id="vh${i}"></span>`;
    grid.appendChild(item);
  });
}

function checkVocab() {
  let correct = 0;
  vocabQuiz.forEach(([en, cn], i) => {
    const item = document.getElementById('vw' + i);
    const input = document.getElementById('vi' + i);
    const hint = document.getElementById('vh' + i);
    const user = input.value.trim();
    item.classList.remove('correct', 'wrong', 'show-answer');
    hint.textContent = '';
    if (user === cn) {
      item.classList.add('correct');
      correct++;
    } else if (user === '') {
      item.classList.add('wrong');
      hint.textContent = cn;
      hint.style.color = '#e74c3c';
      item.classList.add('show-answer');
    } else {
      item.classList.add('wrong');
      hint.textContent = cn;
      hint.style.color = '#e74c3c';
      item.classList.add('show-answer');
    }
  });
  const pct = Math.round(correct / vocabQuiz.length * 100);
  const bar = document.getElementById('vocabResult');
  bar.textContent = `${correct} / ${vocabQuiz.length} 正确（${pct}%）`;
  bar.className = pct >= 90 ? 'score-good' : 'score-bad';
  bar.style.cssText = 'font-weight:600;margin-left:12px;' + (pct >= 90 ? 'color:#27ae60' : 'color:#e74c3c');
}

// ── 导航 ──────────────────────────────────────────
function show(id) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  event.target.classList.add('active');
}

// 初始化
genQuestions();
renderCard();
genVocab();
</script>
</body>
</html>
